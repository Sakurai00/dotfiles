---

- name: Clone fzf (Linux)
  ansible.builtin.git:
    repo: https://github.com/junegunn/fzf.git
    dest: "{{ home }}/.fzf"
    version: master
  register: fzf_repo
  when: ansible_facts['system'] == 'Linux'

- name: Check if fzf binary is installed (Linux)
  ansible.builtin.stat:
    path: "{{ home }}/.fzf/bin/fzf"
  register: fzf_binary
  when: ansible_facts['system'] == 'Linux'

- name: Install or update fzf shell integration (Linux)
  ansible.builtin.command:
    argv:
      - "{{ home }}/.fzf/install"
      - --no-key-bindings
      - --no-completion
      - --no-update-rc
      - --no-bash
      - --no-zsh
      - --no-fish
  when:
    - ansible_facts['system'] == 'Linux'
    - fzf_repo.changed or not fzf_binary.stat.exists

- name: Install fzf package (macOS)
  ansible.builtin.import_tasks: "{{ playbook_dir }}/roles/shared/tasks/install_os_packages.yml"
  vars:
    _package_manager_packages:
      homebrew: "{{ fzf_darwin_packages }}"
